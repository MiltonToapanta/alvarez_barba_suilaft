# SUILAFT · Alvarez Barba S.A.
# Laravel (API) + React (Vite) + MariaDB, todo detrás de Nginx en http://localhost:8080
services:
  db:
    image: mariadb:11.8
    container_name: ab_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: America/Guayaquil
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3317:3306"   # solo local, para DBeaver/TablePlus
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ./docker/php
    container_name: ab_app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      TZ: America/Guayaquil
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: ab_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  web:
    image: nginx:1.27-alpine
    container_name: ab_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - frontend

volumes:
  db_data:
  frontend_node_modules:

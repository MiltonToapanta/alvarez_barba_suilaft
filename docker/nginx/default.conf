# Un solo origen (localhost:8080): /api y /sanctum van a Laravel, el resto a React (Vite).
# Así la cookie de sesión de Sanctum funciona sin CORS.
server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    root /var/www/backend/public;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/(api|sanctum)/ {
        try_files $uri /index.php?$query_string;
    }

    # Módulo de Inteligencia Artificial (SUILAFT AI). Solo se expone index.php y assets/;
    # la identidad la valida index.php contra /api/yo (sesión del portal con 2FA).
    location = /ia-app { return 302 /ia-app/index.php; }
    location = /ia-app/ { return 302 /ia-app/index.php$is_args$args; }
    location = /ia-app/index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/ia/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 300s;      # respuestas largas de la IA
        fastcgi_hide_header X-Powered-By;
    }
    location /ia-app/assets/ {
        alias /var/www/ia/assets/;
        expires 7d;
    }
    location /ia-app/ { return 404; }

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ { return 404; }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;     # HMR de Vite
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
